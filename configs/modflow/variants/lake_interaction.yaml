output_dir: data/modflow
output_file: modflow_lake_interaction.h5
n_samples: 2000
n_timesteps: 365
n_wells: 5
grid:
  nrow: 25
  ncol: 25
  nlay: 1
  delr: 100.0
  delc: 100.0
  top: 10.0
  botm: 0.0
params:
  hk_min: 2.0
  hk_max: 80.0
  sy_min: 0.05
  sy_max: 0.35
  pumping_min: -8000.0
  pumping_max: -500.0
  strt_min: 4.0
  strt_max: 9.0
  rch_min: 0.0005
  rch_max: 0.03
  lake_stage_min: 7.0
  lake_stage_max: 12.0
  lake_cond_min: 30.0
  lake_cond_max: 800.0
lake:
  enabled: true
  location: center
  radius: 5
augmentation:
  enabled: true
  method: parameter_sampling
  perturbation_ratio: 0.05
  seed_ratio: 1.0
  augmentation_batch_size: 1000
validation:
  max_nan_ratio: 0.05
  min_variance: 1.0e-06
  max_head_value: 15.0
  min_head_value: -5.0
seed: 1005
