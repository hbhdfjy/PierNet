# IEEE 14节点轻负荷高可再生场景
# 仿真类型：稳态潮流（pandapower）
# 特点：夜间/春秋轻负荷，高可再生渗透（50-100%），电压偏高，潮流反转

scenario_name: ieee14_light
simulation_type: powerflow
output_dir: data/power_system
output_file: ieee14_light_power_timeseries.h5
n_samples: 10000

params:
  load_scale_min: 0.4
  load_scale_max: 0.8
  P_load_std_min: 5.0
  P_load_std_max: 50.0
  Q_load_ratio_min: 0.05
  Q_load_ratio_max: 0.3
  grid_voltage_pu_min: 0.95
  grid_voltage_pu_max: 1.08
  renewable_ratio_min: 0.5
  renewable_ratio_max: 1.0
  fault_duration_min: 0.0
  fault_duration_max: 0.0
  inertia_mean_min: 2.0
  inertia_mean_max: 6.0
  damping_mean_min: 0.3
  damping_mean_max: 2.0
  line_loading_min: 0.1
  line_loading_max: 0.6
  freq_dev_min: 0.0
  freq_dev_max: 0.3
  seasonal_amp_min: 0.10
  seasonal_amp_max: 0.40
  weekly_drop_min: 0.10
  weekly_drop_max: 0.30
  noise_std_min: 0.02
  noise_std_max: 0.10

augmentation:
  enabled: true
  method: parameter_sampling
  perturbation_ratio: 0.05
  seed_ratio: 0.1
  augmentation_batch_size: 500

validation:
  max_nan_ratio: 0.05
  min_variance: 1.0e-8
  min_head_value: 0.7
  max_head_value: 1.3

seed: 2012
