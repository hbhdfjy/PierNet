# extends: configs/global.yaml
# 覆盖项：output_file, n_samples, seed, params

scenario_name: ieee14_baseload
simulation_type: powerflow
output_dir: data/power_flow
output_file: power_flow_ieee14_baseload.h5
n_samples: 10000

params:
  load_scale_min: 0.7
  load_scale_max: 1.3
  P_load_std_min: 10.0
  P_load_std_max: 80.0
  Q_load_ratio_min: 0.1
  Q_load_ratio_max: 0.5
  grid_voltage_pu_min: 0.95
  grid_voltage_pu_max: 1.05
  renewable_ratio_min: 0.0
  renewable_ratio_max: 0.1
  fault_duration_min: 0.0
  fault_duration_max: 0.0
  inertia_mean_min: 4.0
  inertia_mean_max: 8.0
  damping_mean_min: 1.0
  damping_mean_max: 4.0
  line_loading_min: 0.4
  line_loading_max: 0.85
  freq_dev_min: 0.0
  freq_dev_max: 0.1
  seasonal_amp_min: 0.05
  seasonal_amp_max: 0.30
  weekly_drop_min: 0.05
  weekly_drop_max: 0.25
  noise_std_min: 0.01
  noise_std_max: 0.08

augmentation:
  enabled: true
  method: parameter_sampling
  perturbation_ratio: 0.05
  seed_ratio: 0.1
  augmentation_batch_size: 500

validation:
  max_nan_ratio: 0.05
  min_variance: 1.0e-8
  min_head_value: 0.7
  max_head_value: 1.3

seed: 2001
