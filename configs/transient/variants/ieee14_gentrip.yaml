# IEEE 14节点发电机跳闸暂态稳定场景
# 仿真类型：暂态稳定（ANDES DAE）
# 特点：随机一台发电机永久跳闸，系统需重新平衡功率
# 输出形状：(5, 1000) — 5台发电机转子角 × 1000时间步

scenario_name: ieee14_gentrip
simulation_type: transient
output_dir: data/transient
output_file: transient_ieee14_gentrip.h5
n_samples: 5000
n_timesteps: 1000

params:
  load_scale_min: 0.95
  load_scale_max: 1.2
  P_load_std_min: 10.0
  P_load_std_max: 60.0
  Q_load_ratio_min: 0.1
  Q_load_ratio_max: 0.4
  grid_voltage_pu_min: 0.95
  grid_voltage_pu_max: 1.05
  renewable_ratio_min: 0.0
  renewable_ratio_max: 0.2
  fault_duration_min: 0.0
  fault_duration_max: 0.0
  inertia_mean_min: 3.0
  inertia_mean_max: 8.0
  damping_mean_min: 0.5
  damping_mean_max: 4.0
  line_loading_min: 0.3
  line_loading_max: 0.80
  freq_dev_min: 0.0
  freq_dev_max: 0.3

augmentation:
  enabled: true
  method: parameter_sampling
  perturbation_ratio: 0.05
  seed_ratio: 0.2
  augmentation_batch_size: 200

validation:
  max_nan_ratio: 0.05
  min_variance: 1.0e-6
  min_head_value: -3.0
  max_head_value: 3.0

seed: 2015
