# IEEE 14节点负荷阶跃暂态稳定场景
# 仿真类型：暂态稳定（自实现摆方程 + RK4）
# 特点：突然增加负荷，观察频率响应

scenario_name: ieee14_load_step
simulation_type: transient
output_dir: data/transient
output_file: transient_ieee14_load_step.h5
n_samples: 5000
n_timesteps: 1000

params:
  load_scale_min: 0.95
  load_scale_max: 1.3
  P_load_std_min: 10.0
  P_load_std_max: 80.0
  Q_load_ratio_min: 0.1
  Q_load_ratio_max: 0.4
  grid_voltage_pu_min: 0.95
  grid_voltage_pu_max: 1.05
  renewable_ratio_min: 0.0
  renewable_ratio_max: 0.3
  fault_duration_min: 0.0
  fault_duration_max: 0.0
  inertia_mean_min: 3.0
  inertia_mean_max: 8.0
  damping_mean_min: 0.5
  damping_mean_max: 4.0
  line_loading_min: 0.3
  line_loading_max: 0.80
  freq_dev_min: 0.0
  freq_dev_max: 0.4

augmentation:
  enabled: true
  method: parameter_sampling
  perturbation_ratio: 0.05
  seed_ratio: 0.2
  augmentation_batch_size: 200

validation:
  max_nan_ratio: 0.05
  min_variance: 1.0e-6
  min_head_value: -3.0
  max_head_value: 3.0

seed: 2008
