# IEEE 14节点三相短路故障暂态稳定场景
# 仿真类型：暂态稳定（ANDES DAE）
# 特点：随机故障持续时间（0.05-0.25s），测试暂态稳定极限
# 输出形状：(5, 1000) — 5台发电机转子角 × 1000时间步（10秒@100Hz）

scenario_name: ieee14_fault
simulation_type: transient
output_dir: data/power_system
output_file: ieee14_fault_power_timeseries.h5
n_samples: 5000
n_timesteps: 1000

params:
  load_scale_min: 0.95
  load_scale_max: 1.3
  P_load_std_min: 10.0
  P_load_std_max: 80.0
  Q_load_ratio_min: 0.1
  Q_load_ratio_max: 0.4
  grid_voltage_pu_min: 0.95
  grid_voltage_pu_max: 1.05
  renewable_ratio_min: 0.0
  renewable_ratio_max: 0.2
  fault_duration_min: 0.05
  fault_duration_max: 0.25
  inertia_mean_min: 3.0
  inertia_mean_max: 8.0
  damping_mean_min: 0.5
  damping_mean_max: 4.0
  line_loading_min: 0.3
  line_loading_max: 0.85
  freq_dev_min: 0.0
  freq_dev_max: 0.3

augmentation:
  enabled: true
  method: parameter_sampling
  perturbation_ratio: 0.05
  seed_ratio: 0.2
  augmentation_batch_size: 200

validation:
  max_nan_ratio: 0.05
  min_variance: 1.0e-6
  min_head_value: -3.0
  max_head_value: 3.0

seed: 2014
