# extends: configs/global.yaml
# 覆盖项：output_file, n_samples, seed, params

scenario_name: energy_transition
output_dir: data/gcam
output_file: gcam_energy_transition.h5
n_samples: 1000
n_timesteps: 16

params:
  solar_cost_init_min: 30.0
  solar_cost_init_max: 150.0
  cost_learning_rate_min: 0.10
  cost_learning_rate_max: 0.30
  carbon_tax_min: 0.0
  carbon_tax_max: 50.0
  gdp_growth_min: 1.0
  gdp_growth_max: 4.5
  population_growth_min: 0.0
  population_growth_max: 1.5
  energy_intensity_min: 0.6
  energy_intensity_max: 1.5
  fossil_reserve_min: 0.6
  fossil_reserve_max: 1.8
  climate_sensitivity_min: 1.5
  climate_sensitivity_max: 4.5
  discount_rate_min: 0.03
  discount_rate_max: 0.10
  nuclear_cost_min: 60.0
  nuclear_cost_max: 250.0
  ccs_cost_min: 80.0
  ccs_cost_max: 280.0
  ev_penetration_min: 0.0
  ev_penetration_max: 0.8
  industrial_eff_min: 0.0
  industrial_eff_max: 0.4
  land_use_change_min: -1.0
  land_use_change_max: 4.0

augmentation:
  enabled: true
  method: parameter_sampling
  perturbation_ratio: 0.05
  seed_ratio: 0.3
  augmentation_batch_size: 200

seed: 3001
