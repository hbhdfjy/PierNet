data_root: data
registry: configs/text2comp/registry.yaml
output_dir: data/text2comp
parquet_output_dir: data/text2comp_parquet
output_file: all_training_data.jsonl
llm:
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V3.2
  api_key: ""
  temperature: 0.5
  max_tokens: 4096
  max_retries: 5
  timeout: 60
  base_url: ''
  thinking: disabled
generation:
  n_samples_per_scenario: 1000
  max_workers: 5
  language_mix: 0.5
  styles:
  - technical
  - popular
  - concise
  style_weights:
  - 0.4
  - 0.3
  - 0.3
  transform_prob: 0.1
seed: 42
