x-PierNet-common: &PierNet-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: &PierNet-env
    PierNet_ROOT: /app
    PierNet_DATA_ROOT: /app/data
    PierNet_ARTIFACT_ROOT: /app/artifacts
    PierNet_RUNLOG_ROOT: /app/.runlogs
    PierNet_JOB_STORE_PATH: /app/.runlogs/jobs.sqlite
    PierNet_TRAINING_JOB_STORE_PATH: /app/.runlogs/training_jobs.sqlite
    PierNet_LOCK_STORE_PATH: /app/.runlogs/job_locks.sqlite
    PierNet_AUDIT_STORE_PATH: /app/.runlogs/audit_events.sqlite
    PierNet_WORKER_STORE_PATH: /app/.runlogs/worker_heartbeats.sqlite
    PierNet_ROUTER_JSONL_CACHE_DIR: /app/data/router/.parquet_jsonl_cache
    PierNet_WORKER_QUEUE_SYNTH: "${PierNet_WORKER_QUEUE_SYNTH:-1}"
    PierNet_WORKER_QUEUE_TRAINING: "${PierNet_WORKER_QUEUE_TRAINING:-1}"
    PierNet_WORKER_QUEUE_LOCK_TTL_SECONDS: "${PierNet_WORKER_QUEUE_LOCK_TTL_SECONDS:-60}"
    PierNet_SERVICE_RUN_DIR: /app/.runlogs/services
    PierNet_PYTHON: /usr/local/bin/python
    PierNet_TRAINING_PYTHON: /usr/local/bin/python
    PierNet_CONDA_ENV: /usr/local
    PierNet_NPM: npm
    PierNet_NODE_BIN: ""
    PierNet_QWEN_EMBEDDING_MODEL: /models/qwen
    PierNet_QWEN_EMBEDDING_TOKENIZER: /models/qwen
  volumes: &PierNet-volumes
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./.runlogs:/app/.runlogs
    - ${PierNet_QWEN_EMBEDDING_MODEL:-./models/Qwen/Qwen2.5-0.5B-Instruct}:/models/qwen:ro
  restart: unless-stopped

services:
  backend:
    <<: *PierNet-common
    ports:
      - "${PierNet_BACKEND_PORT:-8000}:8000"

  worker:
    <<: *PierNet-common
    command: ["python", "-m", "PierNet.worker", "--interval", "5"]
