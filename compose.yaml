x-piern-common: &piern-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: &piern-env
    PIERN_ROOT: /app
    PIERN_DATA_ROOT: /app/data
    PIERN_ARTIFACT_ROOT: /app/artifacts
    PIERN_RUNLOG_ROOT: /app/.runlogs
    PIERN_JOB_STORE_PATH: /app/.runlogs/jobs.sqlite
    PIERN_TRAINING_JOB_STORE_PATH: /app/.runlogs/training_jobs.sqlite
    PIERN_LOCK_STORE_PATH: /app/.runlogs/job_locks.sqlite
    PIERN_AUDIT_STORE_PATH: /app/.runlogs/audit_events.sqlite
    PIERN_WORKER_STORE_PATH: /app/.runlogs/worker_heartbeats.sqlite
    PIERN_ROUTER_JSONL_CACHE_DIR: /app/data/router/.parquet_jsonl_cache
    PIERN_WORKER_QUEUE_SYNTH: "${PIERN_WORKER_QUEUE_SYNTH:-1}"
    PIERN_WORKER_QUEUE_TRAINING: "${PIERN_WORKER_QUEUE_TRAINING:-1}"
    PIERN_WORKER_QUEUE_LOCK_TTL_SECONDS: "${PIERN_WORKER_QUEUE_LOCK_TTL_SECONDS:-60}"
    PIERN_SERVICE_RUN_DIR: /app/.runlogs/services
    PIERN_PYTHON: /usr/local/bin/python
    PIERN_TRAINING_PYTHON: /usr/local/bin/python
    PIERN_CONDA_ENV: /usr/local
    PIERN_NPM: npm
    PIERN_NODE_BIN: ""
    PIERN_QWEN_EMBEDDING_MODEL: /models/qwen
    PIERN_QWEN_EMBEDDING_TOKENIZER: /models/qwen
  volumes: &piern-volumes
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./.runlogs:/app/.runlogs
    - ${PIERN_QWEN_EMBEDDING_MODEL:-./models/Qwen/Qwen2.5-0.5B-Instruct}:/models/qwen:ro
  restart: unless-stopped

services:
  backend:
    <<: *piern-common
    ports:
      - "${PIERN_BACKEND_PORT:-8000}:8000"

  worker:
    <<: *piern-common
    command: ["python", "-m", "piern.worker", "--interval", "5"]
